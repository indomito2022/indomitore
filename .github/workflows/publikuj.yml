name: Publikuj stronę indomitore.com

on:
  schedule:
    - cron: "17 4 * * *"   # codziennie ok. 6:17 czasu hiszpańskiego (lato)
  workflow_dispatch:         # przycisk "Run workflow" do ręcznej aktualizacji
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zbuduj stronę z feedu RedSP i Notion
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB: ${{ vars.NOTION_DB }}
          SITE_DOMAIN: indomitore.com
        run: python3 build.py --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
