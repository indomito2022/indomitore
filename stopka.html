<footer><div class="wrap">
  <img src="{{base}}logo-pelne.png" alt="Indómito Real Estate" width="127" height="52" loading="lazy">
  <div class="fl">
    <span>© {{year}} Indómito Real Estate · Klaudia Szafran · RAICV 4368</span>
    <span>Calle Marqués de Sotelo 5, bajo 5, 46002 Valencia · +34 613 15 27 55 · info@indomitore.com</span>
    <span>{{footer_offers}}</span>
    <span><a href="{{privacy_url}}">{{priv}}</a> · <a href="#newsletter" data-nl-open>{{nl_link}}</a></span>
  </div>
</div></footer>

<a class="wa-float" href="{{wa_link}}" target="_blank" rel="noopener" aria-label="{{wa_btn}}"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3Z"/></svg></i><span>{{wa_btn}}</span></a>
<dialog class="nlpop" id="nlPop" aria-labelledby="nlH">
  <button class="nlx" type="button" data-nl-close aria-label="{{nl_close}}">×</button>
  <div class="nlpop-in">
    <div class="nlpop-img"><img src="{{base}}newsletter.jpg?v={{ver}}" alt="" loading="lazy"></div>
    <div class="nlpop-body">
      <div class="eyebrow">{{nl_eyebrow}}</div>
      <h2 id="nlH">{{nl_h}}</h2>
      <p>{{nl_p}}</p>
      <form class="nl-form" data-news novalidate>
        <input name="name" autocomplete="given-name" placeholder="{{nl_name}}" aria-label="{{nl_name}}">
        <input name="email" type="email" autocomplete="email" placeholder="{{nl_email}}" aria-label="{{nl_email}}" required>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="consent"><input type="checkbox" name="consent_mkt" required> <span>{{nl_consent}} <a href="{{privacy_url}}">{{priv}}</a></span></label>
        <button class="btn gold" type="submit">{{nl_btn}}</button>
        <p class="note" data-note></p>
      </form>
      <button class="nl-later" type="button" data-nl-close>{{nl_later}}</button>
    </div>
  </div>
</dialog>
<script>window.FORM={{form_cfg}};</script>
<script src="{{base}}formularz.js?v={{ver}}" defer></script>
